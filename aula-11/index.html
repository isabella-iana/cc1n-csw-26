<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - ID, Class, Div, Span e Pseudo-seletores</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1 id="titulo">Meus Apps de Música</h1>

    <div class="caixa">
        <h2>Sobre</h2>
        <p>
            Esta é a primeira <span style="color:#1BA1E2; font-weight:bold;">div</span>.
            O <strong>span</strong> acima estiliza só um trecho do texto, sem quebrar a linha.
            Abaixo, na segunda div, estão os links para os serviços de música.
        </p>
    </div>

    <div class="caixa">
        <h2>Ouça agora</h2>

        <a class="musica" href="https://open.spotify.com" target="_blank">Spotify</a>
        <a class="musica" href="https://www.youtube.com" target="_blank">YouTube</a>
        <a class="musica" href="https://music.amazon.com" target="_blank">Amazon Music</a>
    </div>

</body>
</html>
